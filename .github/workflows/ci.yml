name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:rules

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Configure the app for the emulators
        run: |
          cat > .env.local <<'ENV'
          NEXT_PUBLIC_FIREBASE_API_KEY=demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=demo-recall.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=demo-recall
          NEXT_PUBLIC_FIREBASE_APP_ID=1:1:web:1
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS=true
          FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          ENV
      - run: npm run build
      - run: npm run test:e2e
